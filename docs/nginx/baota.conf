# ============================================================
# Mizuki 博客 · 宝塔面板 Nginx 站点配置片段
# ------------------------------------------------------------
# 用法（二选一）：
#   1) 宝塔 → 网站 → 你的站点 → 设置 → 配置文件
#      把下面内容「合并」进已有的 server { } 块内（不要重复写 server { }）
#   2) 宝塔 → 网站 → 你的站点 → 设置 → 伪静态
#      直接整段粘贴
#
# 注意 1：站点根目录由面板的「网站目录 / 运行目录」自动写入 root 指令，
#        所以本片段不再写 root，避免两处冲突。
# 注意 2：项目中 astro.config.mjs 设置了 trailingSlash: "always"，
#        所有页面都会编译成 /xxx/index.html，因此必须保留 try_files 规则。
# ============================================================

# ⚠ 如果你的服务器上 dist 不在「网站目录 + 运行目录」拼出的位置，
#   才需要取消下面这行的注释并改成真实路径；否则不要动，交给面板管理。
# root /www/wwwroot/mizuki/dist;

index index.html;

# 静态文件优先，找不到再回退到目录 / 目录下的 index.html，最后才是 404
location / {
    try_files $uri $uri/ $uri/index.html =404;
}

# Astro 已生成 404.html，直接复用
error_page 404 /404.html;

# 带内容 hash 的构建产物，可长期缓存
# （用 expires 而非 add_header，避免打断下方安全响应头的继承）
location /_astro/ {
    expires 1y;
}

# pagefind 搜索索引
location /pagefind/ {
    expires 7d;
}

# 静态资源目录
location /assets/ {
    expires 30d;
}

location /images/ {
    expires 30d;
}

location /pio/ {
    expires 30d;
}

location /js/ {
    expires 30d;
}

# 压缩
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;

# 安全响应头（与项目 vercel.json 中的配置保持一致）
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options DENY;
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy strict-origin-when-cross-origin;
