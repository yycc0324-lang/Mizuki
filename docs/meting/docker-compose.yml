# ============================================================
# meting-api 自建服务（Docker Compose）
# ------------------------------------------------------------
# 用法（服务器上）：
#   mkdir -p /www/wwwroot/meting && cd /www/wwwroot/meting
#   git clone --depth 1 https://github.com/injahow/meting-api.git
#   # 把本目录的 Dockerfile / docker-compose.yml 一起放到这里
#   docker compose up -d --build
#   curl "http://127.0.0.1:8899/?server=netease&type=playlist&id=14164869977"
#
# 说明：
#   - 端口只绑定 127.0.0.1，不直接对外；对外统一由 Nginx 反代（见 nginx-meting.conf）
#   - 与博客静态站（宝塔 Nginx 托管 dist）完全隔离，互不影响
# ============================================================
services:
  meting:
    build: .
    image: mizuki-meting:latest
    container_name: meting
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:80"
    volumes:
      # 把歌单缓存持久化到宿主机，容器重建不丢
      - ./meting-api/cache:/var/www/html/cache
      # ★ 登录 Cookie（QQ/网易云）：只读挂载进容器，
      #   index.php 在每次请求时读取它 →
      #   Cookie 过期后只需覆盖宿主机上的这个文件，刷新页面即生效，
      #   无需重启容器、无需重建镜像。
      - ./qq-cookie.txt:/var/www/html/qq-cookie.txt:ro
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1/?server=netease&type=name&id=416892104' >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
