# ============================================================
# Mizuki 博客 · Meting 在线音乐接口 Nginx 反向代理片段
# ------------------------------------------------------------
# 适用：宝塔面板新建独立站点（如 meting.cnyicheng.top）后，
#       把本片段合并进该站点的 server { } 块内
#      （「设置 → 配置文件」或「设置 → 伪静态」，二者取其一）。
#
# 为什么需要反代：
#   Docker 容器只监听 127.0.0.1:8899，对外要经 Nginx 转发，
#   并统一挂 HTTPS 证书（博客是 https，前端 fetch 必须是 https，
#   否则会被浏览器按「混合内容」拦截）。
#
# 注意：
#   1. CORS 响应头由 meting-api 的 index.php 自带
#      （Access-Control-Allow-Origin: *），这里不要重复添加，
#      免得 add_header 继承规则把它的头覆盖掉。
#   2. proxy_set_header Host $host 必须保留：
#      meting-api 用 $_SERVER['HTTP_HOST'] 生成 url/pic/lrc 链接，
#      Host 变了会导致返回的音频地址指向错误域名。
# ============================================================

location / {
    proxy_pass http://127.0.0.1:8899;
    proxy_http_version 1.1;

    # 生成播放地址所依赖的请求信息
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 上游要请求音乐平台接口，偶尔较慢，超时放宽
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 播放列表是小 JSON，关掉缓冲让响应更快返回
    proxy_buffering off;
}

# 上游返回 302 跳到音乐 CDN，音频流量不经过本服务器；
# 若想连演示页静态资源一起缓存，可再补一段 location ~* \.(css|js|png|ico)$ 。
